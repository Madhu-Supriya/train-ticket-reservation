name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

# ---------------- BUILD ----------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war


# ---------------- DEV ----------------
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to DEV
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_DEV }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_DEV }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          set -e

          WAR_FILE=$(find . -name "*.war" | head -1)

          echo "Deploying DEV: $WAR_FILE"

          if [ -z "$TOMCAT_URL" ]; then
            echo "ERROR: TOMCAT_URL_DEV is empty"
            exit 1
          fi

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-dev&update=true"


# ---------------- TEST ----------------
  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to TEST
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_TEST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_TEST }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_TEST }}
        run: |
          set -e

          WAR_FILE=$(find . -name "*.war" | head -1)

          echo "Deploying TEST: $WAR_FILE"

          if [ -z "$TOMCAT_URL" ]; then
            echo "ERROR: TOMCAT_URL_TEST is empty"
            exit 1
          fi

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-test&update=true"


# ---------------- PRE-PROD ----------------
  deploy-preprod:
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to PRE-PROD
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_PREPROD }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_PREPROD }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_PREPROD }}
        run: |
          set -e

          WAR_FILE=$(find . -name "*.war" | head -1)

          echo "Deploying PRE-PROD: $WAR_FILE"

          if [ -z "$TOMCAT_URL" ]; then
            echo "ERROR: TOMCAT_URL_PREPROD is empty"
            exit 1
          fi

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-preprod&update=true"


# ---------------- PROD ----------------
  deploy-prod:
    needs: deploy-preprod
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to PROD
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_PROD }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_PROD }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_PROD }}
        run: |
          set -e

          WAR_FILE=$(find . -name "*.war" | head -1)

          echo "Deploying PROD: $WAR_FILE"

          if [ -z "$TOMCAT_URL" ]; then
            echo "ERROR: TOMCAT_URL_PROD is empty"
            exit 1
          fi

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket&update=true"
