name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: mvn clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war


# ---------------- DEV ----------------
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy DEV
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_DEV }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_DEV }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          WAR_FILE=$(find . -name "*.war" | head -1)

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-dev&update=true"


# ---------------- TEST ----------------
  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy TEST
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_TEST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_TEST }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_TEST }}
        run: |
          WAR_FILE=$(find . -name "*.war" | head -1)

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-test&update=true"


# ---------------- PRE-POD ----------------
  deploy-pre-pod:
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy PRE-POD
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_PRE_POD }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_PRE_POD }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_PRE_POD }}
        run: |
          WAR_FILE=$(find . -name "*.war" | head -1)

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-prepod&update=true"


# ---------------- POD (PROD) ----------------
  deploy-pod:
    needs: deploy-pre-pod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy PROD (POD)
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_POD }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_POD }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_POD }}
        run: |
          WAR_FILE=$(find . -name "*.war" | head -1)

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket&update=true"
