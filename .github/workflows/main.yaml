name: Build and Deploy train-ticket-reservation

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Verify WAR
        run: |
          echo "Generated WAR files:"
          ls -lh target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war


  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Locate WAR File
        run: |
          WAR_FILE=$(find . -name "*.war" | head -1)
          echo "WAR_FILE=$WAR_FILE" >> $GITHUB_ENV
          echo "Found WAR: $WAR_FILE"

      - name: Deploy to Tomcat DEV
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_DEV }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_DEV }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_DEV }}
        run: |
          echo "Checking Tomcat connection..."

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          echo "Deploying WAR to Tomcat..."

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-reservation&update=true"


  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Locate WAR File
        run: |
          WAR_FILE=$(find . -name "*.war" | head -1)
          echo "WAR_FILE=$WAR_FILE" >> $GITHUB_ENV
          echo "Found WAR: $WAR_FILE"

      - name: Deploy to Tomcat TEST
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL_TEST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER_TEST }}
          TOMCAT_PASS: ${{ secrets.TOMCAT_PASS_TEST }}
        run: |
          echo "Checking Tomcat connection..."

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            "$TOMCAT_URL/list"

          echo "Deploying WAR to Tomcat..."

          curl -v --fail --show-error \
            --user "$TOMCAT_USER:$TOMCAT_PASS" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/deploy?path=/train-ticket-reservation&update=true"

            
